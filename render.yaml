# Blueprint do Render — cria o serviço web automaticamente a partir deste repositório
# Deploy: render.com → New + → Blueprint → escolha este repo
services:
  - type: web
    name: cuscuz-med
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Senha do app (login). O Render gera sozinho; veja o valor em Environment > APP_PASSWORD
      - key: APP_PASSWORD
        generateValue: true
      # Credenciais do Hardworq — o Render pergunta na hora do deploy (não ficam no repo)
      - key: HARDWORQ_EMAIL
        sync: false
      - key: HARDWORQ_SENHA
        sync: false
      - key: HARDWORQ_ID_TURMA
        value: "1273"
      - key: HARDWORQ_AUTO_SYNC
        value: "0"
      - key: HARDWORQ_SYNC_INTERVAL_H
        value: "6"
      - key: HARDWORQ_MAX_BANK
        value: "2000"
      # Espelho contínuo do banco do Hardworq (liga sozinho quando há e-mail/senha)
      - key: HARDWORQ_MIRROR
        value: "1"
      - key: HARDWORQ_MIRROR_MAX
        value: "25000"
      # Token do GitHub (Fine-grained, Contents: read and write neste repositório) para o servidor publicar o banco catalogado
      - key: GITHUB_TOKEN
        sync: false
      # Google Drive API
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FLASHCARDS_ROOTS
        sync: false
      - key: GOOGLE_DRIVE_FLASHCARDS_SYNC
        value: "true"
      - key: FLASHCARD_MAX_PACKAGE_BYTES
        value: "6442450944"
      # Supabase Storage: o acervo pode usar ANON_KEY, mas flashcards precisam gravar no bucket privado.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Webhook do Google Drive (push real-time) e cron de manutenção
      - key: DRIVE_PUSH_WEBHOOK_URL
        sync: false
      - key: DRIVE_PUSH_WEBHOOK_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      # Opcionais (deixe em branco se não usar; o app funciona sem elas, com recursos reduzidos)
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TPM
        value: "8000"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_PROVIDER
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22.14.0"
