# Blueprint do Render — cria o serviço web automaticamente a partir deste repositório
# Deploy: render.com → New + → Blueprint → escolha este repo
services:
  - type: web
    name: cuscuz-med
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Senha do app (login). O Render gera sozinho; veja o valor em Environment > APP_PASSWORD
      - key: APP_PASSWORD
        generateValue: true
      # Credenciais do Hardworq — o Render pergunta na hora do deploy (não ficam no repo)
      - key: HARDWORQ_EMAIL
        sync: false
      - key: HARDWORQ_SENHA
        sync: false
      - key: HARDWORQ_ID_TURMA
        value: "1273"
      - key: HARDWORQ_AUTO_SYNC
        value: "0"
      - key: HARDWORQ_SYNC_INTERVAL_H
        value: "6"
      - key: HARDWORQ_MAX_BANK
        value: "2000"
      # Espelho contínuo do banco do Hardworq (liga sozinho quando há e-mail/senha)
      - key: HARDWORQ_MIRROR
        value: "1"
      - key: HARDWORQ_MIRROR_MAX
        value: "25000"
      # Token do GitHub (Fine-grained, Contents: read and write neste repositório) para o servidor publicar o banco catalogado
      - key: GITHUB_TOKEN
        sync: false
      # Google Drive API
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      # Opcionais (deixe em branco se não usar; o app funciona sem elas, com recursos reduzidos)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22.14.0"
